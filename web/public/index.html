<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>justic — 設計書レビュー</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="head-row">
    <div>
      <h1>justic</h1>
      <p class="sub">設計書をレビューする。採用と却下がそのまま学習データになる。</p>
    </div>
    <div id="account" class="account"></div>
  </div>
  <div id="stats" class="stats"></div>
</header>

<main>
  <section class="pane">
    <div class="tabs" role="tablist">
      <button class="tab on" data-mode="paste">貼り付け</button>
      <button class="tab" data-mode="pr">PR の差分</button>
      <button class="tab" data-mode="branch">ブランチ走査</button>
    </div>

    <div class="mode" data-mode="paste">
      <input id="title" placeholder="表題 (任意)">
      <textarea id="body" spellcheck="false"></textarea>
      <button id="sample" class="ghost small">例文を入れる</button>
    </div>

    <div class="mode" data-mode="pr" hidden>
      <input id="prRef" placeholder="https://github.com/owner/repo/pull/12  または  owner/repo#12">
      <p class="help">その PR が<strong>足した行</strong>の文体指摘だけを出す。もとからあった行は出さない。<br>
        L3 (設計内容) は全文を見る。書かれていないことは差分では判定できないため。</p>
    </div>

    <div class="mode" data-mode="branch" hidden>
      <input id="repoRef" placeholder="https://github.com/owner/repo  または  owner/repo">
      <div class="row">
        <input id="prefix" placeholder="パスの前方一致 (例 docs/)" style="flex:2 1 160px">
        <input id="maxFiles" type="number" min="1" max="50" value="10" title="検査する最大ファイル数" style="flex:0 0 80px">
      </div>
      <p class="help">デフォルトブランチの Markdown を走査する。<strong>採用した指摘から issue を立てられる。</strong></p>
    </div>

    <div class="actions">
      <button id="run" class="primary">検査する</button>
      <label class="l3"><input type="checkbox" id="useL3" checked> 設計チェック (LLM)</label>
      <span id="runState" class="state"></span>
    </div>

    <div id="issuePanel" class="issue-panel" hidden>
      <label>起票先 <input id="issueRepo" placeholder="owner/repo"></label>
      <p class="help">採用した指摘だけが起票される。同じ指摘からは二度立たない。</p>
    </div>
  </section>

  <section class="pane">
    <div class="pane-head">
      <h2>指摘</h2>
      <span id="counts" class="counts"></span>
    </div>
    <div id="notice" class="notice" hidden></div>
    <div id="results" class="findings">
      <p class="empty">左で対象を選んで「検査する」を押す。</p>
    </div>
  </section>
</main>

<footer>
  <span id="health"></span>
  <span class="hint">閉じただけのものは未判断として残る。却下にはならない。</span>
</footer>

<script src="app.js" type="module"></script>
</body>
</html>
